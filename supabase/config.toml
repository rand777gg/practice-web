
[functions.cloudflare-turnstile]
enabled = true
verify_jwt = false
import_map = "./functions/cloudflare-turnstile/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/cloudflare-turnstile/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/cloudflare-turnstile/*.html" ]

[functions.study-room]
enabled = true
verify_jwt = false
entrypoint = "./functions/study-room/index.ts"

[functions.notify-exam]
enabled = true
verify_jwt = false
entrypoint = "./functions/notify-exam/index.ts"

[functions.mcp]
enabled = true
# 自己校验 token(auth.getUser),这样 401 能回 MCP 客户端看得懂的 JSON-RPC 错误
verify_jwt = false
entrypoint = "./functions/mcp/index.ts"
