name: Database Backup

on:
  schedule:
    - cron: '20 2 * * *' # daily 02:20 UTC
  workflow_dispatch: # manual test run

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg client matching server version + rclone
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client unzip
          # latest rclone (Ubuntu package 1.60 is too old for clean R2 support)
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -o /tmp/rclone.zip -d /tmp/rclone-extract
          sudo cp /tmp/rclone-extract/rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version | head -n1
          MAJOR="$(psql "$SUPABASE_DB_URL" -tAc 'show server_version' | cut -d. -f1 | tr -d ' ')"
          echo "server major=$MAJOR"
          if [[ ! -x "/usr/lib/postgresql/${MAJOR}/bin/pg_dump" ]]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -y
            sudo apt-get install -y "postgresql-client-${MAJOR}"
          fi
          echo "PG_BIN=/usr/lib/postgresql/${MAJOR}/bin" >> "$GITHUB_ENV"

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: bash scripts/backup/backup.sh

      - name: Notify on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [[ -n "$ALERT_WEBHOOK_URL" ]]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"Database backup failed: ${{ github.repository }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" \
              "$ALERT_WEBHOOK_URL"
          else
            echo "no ALERT_WEBHOOK_URL configured, skipping notification"
          fi
