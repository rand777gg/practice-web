name: Hermes Bot

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lark-cli
        run: npm install -g @larksuite/cli

      - name: Auth lark-cli
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          mkdir -p ~/.lark-cli
          echo "{\"appId\":\"${LARK_APP_ID}\",\"appSecret\":\"${LARK_APP_SECRET}\",\"brand\":\"feishu\"}" > ~/.lark-cli/config.json

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .hermes-state
          key: hermes-state-${{ github.run_id }}
          restore-keys: hermes-state-

      - name: Run Hermes Bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_BOT_HOOK: ${{ secrets.FEISHU_BOT_HOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/hermes-bot.mjs --once

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: .hermes-state
          key: hermes-state-${{ github.run_id }}
