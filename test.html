<!DOCTYPE html>
<html>
<head>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  .container {
    height: 300vh; /* 3个功能 * 100vh */
    position: relative;
  }
  
  .sticky-wrapper {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .view {
    position: relative;
    width: 80%;
    max-width: 800px;
    height: 70vh;
  }
  
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    font-size: 2rem;
    border-radius: 20px;
    opacity: 0;
    transform: scale(0.85);
    transition: none; /* 由JS控制 */
    pointer-events: none;
  }
  
  .slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  
  .slide-1 { background: #e94560; }
  .slide-2 { background: #0f3460; }
  .slide-3 { background: #16213e; }
  
  .spacer {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
  }
</style>
</head>
<body>

<div class="spacer">↑ 向下滚动体验效果</div>

<div class="container">
  <div class="sticky-wrapper">
    <div class="view">
      <div class="slide slide-1 active">功能 A<br><small>数据分析</small></div>
      <div class="slide slide-2">功能 B<br><small>可视化报表</small></div>
      <div class="slide slide-3">功能 C<br><small>AI 智能推荐</small></div>
    </div>
  </div>
</div>

<div class="spacer">效果结束 ↑</div>

<script>
const slides = document.querySelectorAll('.slide');
const container = document.querySelector('.container');
const view = document.querySelector('.view');

let currentIndex = 0;

function updateSlides(scrollProgress) {
  // scrollProgress: 0 ~ 1 (相对于container顶部)
  const totalSlides = slides.length;
  const step = 1 / (totalSlides - 1);
  
  // 计算当前应该显示哪个slide
  const index = Math.min(Math.floor(scrollProgress / step), totalSlides - 2);
  const nextIndex = index + 1;
  
  // 计算过渡进度 0~1
  const progress = (scrollProgress - index * step) / step;
  const clampedProgress = Math.min(Math.max(progress, 0), 1);
  
  // 更新每个slide
  slides.forEach((slide, i) => {
    let opacity = 0;
    let scale = 0.85;
    
    if (i === index) {
      // 当前slide：淡出 + 缩小
      opacity = 1 - clampedProgress;
      scale = 1 - clampedProgress * 0.15;
    } else if (i === nextIndex) {
      // 下一个slide：淡入 + 放大
      opacity = clampedProgress;
      scale = 0.85 + clampedProgress * 0.15;
    } else if (i < index) {
      opacity = 0;
      scale = 0.85;
    } else if (i > nextIndex) {
      opacity = 0;
      scale = 0.85;
    }
    
    slide.style.opacity = opacity;
    slide.style.transform = `scale(${scale})`;
  });
}

window.addEventListener('scroll', () => {
  const rect = container.getBoundingClientRect();
  const containerHeight = container.offsetHeight - window.innerHeight;
  
  // 计算滚动进度
  const scrolled = Math.max(0, -rect.top);
  const progress = Math.min(scrolled / containerHeight, 1);
  
  updateSlides(progress);
});

// 初始状态
updateSlides(0);
</script>
</body>
</html>
