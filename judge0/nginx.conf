# 反代到内部 Judge0 server;补 CORS + Private Network Access 头,供浏览器直连。
upstream judge0_server {
  server server:2358;
}

server {
  listen 80;
  server_name _;

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "POST, GET, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Auth-Token, X-Auth-User" always;
      # Private Network Access:让公开(HTTPS)页面可直连本机 Judge0
      add_header Access-Control-Allow-Private-Network "true" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }

    # 每次真实请求也回补 CORS / PNA 头,便于浏览器跨域读取
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "POST, GET, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Auth-Token, X-Auth-User" always;
    add_header Access-Control-Allow-Private-Network "true" always;

    proxy_pass http://judge0_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
