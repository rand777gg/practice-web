# Judge0 CE v1.13.1 —— 一键本地判题(浏览器直连友好版)
#
# 用法(在 practice-web/judge0 目录下):
#   docker compose up -d
#
# 装好后:
#   curl http://localhost:2358/config_info   # 看到 JSON 即成功
# 打开应用后,在编程题编辑器顶部开启「本地自测」即可。
#
# 架构:server(judge0) 只暴露到内部,前端统一走轻量 nginx 反代(端口 2358)。
# nginx 负责补 CORS 与 Private Network Access(Access-Control-Allow-Private-Network)
# 响应头,让「生产 HTTPS 域名上的应用」也能直连本机 Judge0,浏览器不会拦。
#
# 配置集中在同目录 judge0.conf(已内置仅限本机自用的开发密码)。
x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

  # 轻量反代:对外端口 2358 -> server:2358,补 CORS + Private Network Access 头
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - server
    ports:
      - "2358:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *default-logging
    restart: always

volumes:
  data:
