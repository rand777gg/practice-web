# Judge0 CE v1.13.1 —— 平台中心判题节点(公网自部署,自带鉴权)
#
# 架构:server/workers 只在内网;对外统一走轻量 nginx 反代(端口 2358)。
# 鉴权由 Judge0 自身承担(AUTHN_HEADER=Authorization + AUTHZ),见 judge0.conf。
# 浏览器永不直连本节点:平台前端一律经 Supabase Edge Function 转发。
#
# 用法(在 /opt/judge0 下):
#   bash deploy.sh          # 首次/重复部署都走这个,它会生成密钥并套用配置
#   curl -i http://127.0.0.1:2358/config_info                                  # 预期 401(无 token)
#   curl -i -H "Authorization: $AUTHN_TOKEN" http://127.0.0.1:2358/config_info # 预期 200
x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    # 浮动 minor 标签:同系列内自动拿到 patch 级安全更新(16.2 -> 16.15 这类),
    # 大版本不跨。autoupdate.sh 会在闲时拉取,并做自检与自动回滚。
    image: postgres:16
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

  # 对外只绑 loopback:公网入口是 Cloudflare 隧道(cloudflared 在宿主机上回源 localhost:2358),
  # 所以不需要、也不应该把 2358 发布到公网。要临时直连调试再改成 "2358:80"。
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - server
    ports:
      - "127.0.0.1:2358:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *default-logging
    restart: always

volumes:
  data:
