# 反代到内部 Judge0 server。鉴权(AUTHN/AUTHZ)由 Judge0 自己做,
# 这里只做透传 + 超时/体积兜底,刻意不加 CORS 头。
upstream judge0_server {
  server server:2358;
}

server {
  listen 80;
  server_name _;

  # 提交里可能带较大的 stdin / base64 代码
  client_max_body_size 32m;

  location = / {
    return 404;
  }

  # 文档页不对外(少暴露一点信息);AUTHN 已经保护了它,这里再收一道
  location /docs {
    return 404;
  }

  location / {
    proxy_pass http://judge0_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization / X-Auth-User 默认原样透传,无需显式设置
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
}
